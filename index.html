<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="theme-color" content="#090a0f">
<title>Gym Tracker</title>
<style>
:root{--bg:#090a0f;--card:#14161d;--in:#0e1016;--tx:#eef0f5;--mu:#8a90a0;--g:linear-gradient(135deg,#3b82f6,#8b5cf6 45%,#ff5a36);--ok:#34d399}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(86px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:4px 2px 12px}h2{font-size:15px;margin:0 0 10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.gb{border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--g) border-box;border-radius:16px;box-shadow:0 0 14px rgba(59,130,246,.12),0 0 18px rgba(255,90,54,.08)}
.card{padding:14px;margin-bottom:12px}
input,select{width:100%;font:inherit;color:var(--tx);padding:12px;border-radius:12px;border:1px solid transparent;background:linear-gradient(var(--in),var(--in)) padding-box,var(--g) border-box;outline:none;min-width:0}
input[type=checkbox]{display:none}
button{font:inherit;color:var(--tx);border:0;border-radius:12px;padding:12px 14px;background:#222633;cursor:pointer}
button:active{transform:scale(.97)}
.pri{background:var(--g);font-weight:600;color:#fff}
.dng{background:#3a1d22;color:#ff8a7a}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row>*{flex:1}.row>.fx{flex:none}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1}.seg .on,.chip.on{background:var(--g);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{padding:7px 12px;border-radius:99px;font-size:14px;background:#222633}
.sw{display:flex;justify-content:space-between;align-items:center;margin:10px 0;cursor:pointer}
.sw i{width:50px;height:30px;border-radius:99px;background:#2a2e3b;position:relative;transition:.2s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--g)}.sw input:checked+i:after{left:23px}
.lbl{font-size:12px;color:var(--mu);flex:none;width:44px}
.tm{font-size:54px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 10px}
.tm.end{animation:bl .6s infinite;color:#ff5a36}@keyframes bl{50%{opacity:.25}}
.mu{color:var(--mu);font-size:14px}.ex{padding:10px 0;border-top:1px solid #232734}.ex:first-of-type{border:0}
.set{display:inline-block;margin:3px 6px 0 0;padding:3px 9px;border-radius:8px;background:#1d212c;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(9,10,15,.94);backdrop-filter:blur(14px);padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #1c1f2a}
nav button{flex:1;background:none;font-size:12px;color:var(--mu);padding:8px 2px}nav button.on{color:#fff}
nav b{display:block;font-size:20px;font-weight:400}
.tab{display:none}.tab.on{display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal span{font-size:12px;color:var(--mu)}
.d{aspect-ratio:1;padding:0;border-radius:10px;background:#1a1d27;position:relative;font-size:14px}
.d.has:after{content:"";position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--g)}
.d.sel{background:var(--g);color:#fff}.d.today{outline:1px solid #3b82f6}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.hd b{text-transform:capitalize}
.x{background:none;color:var(--mu);padding:4px 8px;flex:none}
</style>
</head>
<body>
<h1>Gym Tracker</h1>

<section class="tab on" id="t-w">
 <div class="card gb">
  <h2>Timer recupero</h2>
  <div class="tm" id="tm">0:00</div>
  <div class="row"><button onclick="startT(60)">1 min</button><button onclick="startT(120)">2 min</button><button onclick="startT(180)">3 min</button><button class="dng fx" onclick="stopT()">■</button></div>
 </div>
 <div class="card gb">
  <h2>Gruppi muscolari di oggi</h2>
  <div class="chips" id="sg"></div>
  <div class="row"><select id="tplSel"></select><button class="fx" onclick="loadTpl()">Carica scheda</button></div>
 </div>
 <div class="card gb">
  <h2>Nuovo esercizio</h2>
  <input id="exName" placeholder="Nome esercizio" autocomplete="off">
  <div class="seg" id="typ"><button data-t="forza" class="on">Forza</button><button data-t="cardio">Cardio</button></div>
  <label class="sw"><span>Serie Progressive</span><input type="checkbox" id="prog"><i></i></label>
  <div id="rows"></div>
  <button class="pri" style="width:100%;margin-top:6px" onclick="addEx()">+ Aggiungi esercizio</button>
 </div>
 <div class="card gb">
  <h2>Allenamento in corso</h2>
  <div id="sess"></div>
  <div class="row" style="margin-top:10px"><input type="date" id="wDate"></div>
  <div class="row"><button class="pri" onclick="saveW()">Salva allenamento</button><button onclick="saveTpl()">Salva come scheda</button></div>
  <button class="dng" style="width:100%" onclick="clearS()">Svuota</button>
 </div>
</section>

<section class="tab" id="t-s">
 <div class="card gb"><h2>Schede salvate</h2><div id="tpls"></div></div>
 <div class="card gb">
  <h2>Gruppi muscolari</h2>
  <div class="chips" id="gl"></div>
  <div class="row"><input id="ng" placeholder="Nuovo gruppo (es. Polpacci)"><button class="fx" onclick="addG()">Aggiungi</button></div>
 </div>
</section>

<section class="tab" id="t-c">
 <div class="card gb">
  <div class="hd"><button onclick="mv(-1)">‹</button><b id="mt"></b><button onclick="mv(1)">›</button></div>
  <div class="cal" id="cal"></div>
 </div>
 <div class="card gb"><h2 id="dt">Dettagli</h2><div id="det"><span class="mu">Tocca un giorno.</span></div></div>
</section>

<section class="tab" id="t-d">
 <div class="card gb">
  <h2>Backup dati</h2>
  <p class="mu">I dati sono salvati automaticamente su questo dispositivo. Esporta un backup JSON per sicurezza.</p>
  <button class="pri" style="width:100%;margin-bottom:8px" onclick="exp()">Esporta JSON</button>
  <button style="width:100%" onclick="$('#imp').click()">Importa JSON</button>
  <input type="file" id="imp" accept="application/json,.json" style="display:none">
 </div>
</section>

<nav id="nav">
 <button class="on" data-t="w"><b>🏋️</b>Allena</button>
 <button data-t="s"><b>📋</b>Schede</button>
 <button data-t="c"><b>📅</b>Calendario</button>
 <button data-t="d"><b>💾</b>Dati</button>
</nav>

<script>
const $=s=>document.querySelector(s),KEY='gymtracker.v1';
const DG=['Petto','Schiena','Gambe','Spalle','Bicipiti','Tricipiti','Braccia','Addome','Cardio'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.logs)return d}catch(e){}return{groups:[...DG],templates:[],logs:[],session:{groups:[],exercises:[]}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fmt=(t,s)=>t==='cardio'?`${s.a||'?'}min liv.${s.b||'?'}`:`${s.a||'?'}×${s.b||0}kg`;
const copy=o=>JSON.parse(JSON.stringify(o));

/* PWA manifest */
try{const m={name:'Gym Tracker',short_name:'Gym',display:'standalone',background_color:'#090a0f',theme_color:'#090a0f',start_url:location.href};
const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));document.head.appendChild(l)}catch(e){}

/* Tabs */
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;go(b.dataset.t)};
function go(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id==='t-'+t));
document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
if(t==='c')rCal();if(t==='s')rTpls();scrollTo(0,0)}

/* Timer */
let T={end:0,iv:null},ac=null;
function beep(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();[0,.3,.6].forEach(o=>{const s=ac.createOscillator(),g=ac.createGain();s.connect(g);g.connect(ac.destination);s.frequency.value=880;g.gain.value=.25;s.start(ac.currentTime+o);s.stop(ac.currentTime+o+.2)})}catch(e){}}
function startT(sec){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
clearInterval(T.iv);T.end=Date.now()+sec*1000;$('#tm').classList.remove('end');tick();T.iv=setInterval(tick,250)}
function tick(){const r=Math.max(0,Math.ceil((T.end-Date.now())/1000));$('#tm').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');
if(r<=0){clearInterval(T.iv);T.iv=null;$('#tm').classList.add('end');$('#tm').textContent='Via! 💪';beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}}
function stopT(){clearInterval(T.iv);T.iv=null;$('#tm').classList.remove('end');$('#tm').textContent='0:00'}

/* Form esercizio */
let F={type:'forza',prog:false,n:3,rows:[{a:'',b:''}],a:'',b:''};
$('#typ').onclick=e=>{const b=e.target.closest('button');if(!b)return;F.type=b.dataset.t;document.querySelectorAll('#typ button').forEach(x=>x.classList.toggle('on',x===b));rRows()};
$('#prog').onchange=e=>{F.prog=e.target.checked;rRows()};
function rRows(){const L=F.type==='cardio'?['Min','Liv.']:['Rip.','Kg'];let h='';
if(!F.prog){h=`<div class="row"><span class="lbl">Serie</span><input type="number" inputmode="numeric" value="${F.n}" oninput="F.n=+this.value"></div>
<div class="row"><span class="lbl">${L[0]}</span><input type="number" inputmode="decimal" value="${esc(F.a)}" oninput="F.a=this.value"><span class="lbl">${L[1]}</span><input type="number" inputmode="decimal" value="${esc(F.b)}" oninput="F.b=this.value"></div>`}
else{F.rows.forEach((r,i)=>{h+=`<div class="row"><span class="lbl">Set ${i+1}</span><input type="number" inputmode="decimal" placeholder="${L[0]}" value="${esc(r.a)}" oninput="F.rows[${i}].a=this.value"><input type="number" inputmode="decimal" placeholder="${L[1]}" value="${esc(r.b)}" oninput="F.rows[${i}].b=this.value">${F.rows.length>1?`<button class="x fx" onclick="F.rows.splice(${i},1);rRows()">✕</button>`:''}</div>`});
h+=`<button style="width:100%;margin-bottom:6px" onclick="F.rows.push({...F.rows[F.rows.length-1]});rRows()">+ Serie</button>`}
$('#rows').innerHTML=h}
function addEx(){const name=$('#exName').value.trim();if(!name){$('#exName').focus();return}
let sets=F.prog?F.rows.map(r=>({a:r.a,b:r.b})):Array.from({length:Math.max(1,Math.min(30,F.n||1))},()=>({a:F.a,b:F.b}));
S.session.exercises.push({id:uid(),name,type:F.type,prog:F.prog,sets});save();
$('#exName').value='';F.rows=[{a:'',b:''}];rSess()}

/* Sessione */
function chips(el,sel,fn){el.innerHTML=S.groups.map(g=>`<button class="chip ${sel.includes(g)?'on':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('');
el.onclick=e=>{const b=e.target.closest('.chip');if(b)fn(b.dataset.g)}}
function rSess(){chips($('#sg'),S.session.groups,g=>{const a=S.session.groups,i=a.indexOf(g);i<0?a.push(g):a.splice(i,1);save();rSess()});
$('#tplSel').innerHTML='<option value="">— Scegli scheda —</option>'+S.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
const ex=S.session.exercises;
$('#sess').innerHTML=ex.length?ex.map((e,i)=>`<div class="ex"><div class="row" style="margin:0"><b>${esc(e.name)} <span class="mu">${e.type==='cardio'?'· Cardio':'· Forza'}${e.prog?' · prog.':''}</span></b><button class="x fx" onclick="S.session.exercises.splice(${i},1);save();rSess()">✕</button></div>${e.sets.map((s,j)=>`<span class="set">S${j+1} ${fmt(e.type,s)}</span>`).join('')}</div>`).join(''):'<span class="mu">Nessun esercizio aggiunto.</span>'}
function clearS(){if(confirm('Svuotare l\'allenamento in corso?')){S.session={groups:[],exercises:[]};save();rSess()}}
function saveW(){const s=S.session;if(!s.exercises.length){alert('Aggiungi almeno un esercizio.');return}
S.logs.push({id:uid(),date:$('#wDate').value||dk(new Date()),groups:[...s.groups],exercises:copy(s.exercises)});
S.session={groups:[],exercises:[]};save();rSess();alert('Allenamento salvato ✓')}
function saveTpl(){const s=S.session;if(!s.exercises.length&&!s.groups.length){alert('Niente da salvare.');return}
const n=prompt('Nome scheda:',s.groups.join(' + ')||'Scheda');if(!n)return;
S.templates.push({id:uid(),name:n.trim(),groups:[...s.groups],exercises:copy(s.exercises)});save();rSess();rTpls()}
function loadTpl(){const t=S.templates.find(x=>x.id===$('#tplSel').value);if(!t)return;
S.session={groups:[...t.groups],exercises:copy(t.exercises).map(e=>({...e,id:uid()}))};save();rSess()}

/* Schede & gruppi */
function rTpls(){$('#tpls').innerHTML=S.templates.length?S.templates.map(t=>`<div class="ex"><b>${esc(t.name)}</b><div class="mu">${t.groups.map(esc).join(' + ')||'—'} · ${t.exercises.length} esercizi</div>
<div class="row" style="margin:8px 0 0"><button class="pri" onclick="useTpl('${t.id}')">Usa oggi</button><button class="dng fx" onclick="delTpl('${t.id}')">Elimina</button></div></div>`).join(''):'<span class="mu">Nessuna scheda. Creane una dalla tab Allena.</span>';
$('#gl').innerHTML=S.groups.map(g=>`<span class="chip">${esc(g)} <span style="opacity:.6" onclick="delG('${esc(g).replace(/'/g,"\\'")}')">✕</span></span>`).join('')}
function useTpl(id){$('#tplSel').value=id;loadTpl();go('w')}
function delTpl(id){if(confirm('Eliminare la scheda?')){S.templates=S.templates.filter(t=>t.id!==id);save();rTpls();rSess()}}
function addG(){const v=$('#ng').value.trim();if(v&&!S.groups.includes(v)){S.groups.push(v);save();$('#ng').value='';rTpls();rSess()}}
function delG(g){if(confirm('Rimuovere il gruppo "'+g+'"?')){S.groups=S.groups.filter(x=>x!==g);save();rTpls();rSess()}}

/* Calendario */
let C={y:new Date().getFullYear(),m:new Date().getMonth(),sel:null};
const mv=d=>{C.m+=d;if(C.m<0){C.m=11;C.y--}if(C.m>11){C.m=0;C.y++}rCal()};
function rCal(){const first=new Date(C.y,C.m,1),days=new Date(C.y,C.m+1,0).getDate(),off=(first.getDay()+6)%7,today=dk(new Date());
$('#mt').textContent=first.toLocaleDateString('it-IT',{month:'long',year:'numeric'});
const has=new Set(S.logs.map(l=>l.date));
let h=['L','M','M','G','V','S','D'].map(x=>`<span>${x}</span>`).join('')+'<div></div>'.repeat(off);
for(let d=1;d<=days;d++){const k=C.y+'-'+String(C.m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
h+=`<button class="d ${has.has(k)?'has':''} ${k===C.sel?'sel':''} ${k===today?'today':''}" onclick="C.sel='${k}';rCal()">${d}</button>`}
$('#cal').innerHTML=h;rDet()}
function rDet(){if(!C.sel)return;const L=S.logs.filter(l=>l.date===C.sel);
$('#dt').textContent=new Date(C.sel+'T12:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
$('#det').innerHTML=L.length?L.map(l=>`<div class="ex"><div class="row" style="margin:0"><div class="chips" style="margin:0">${l.groups.map(g=>`<span class="chip on">${esc(g)}</span>`).join('')||'<span class="mu">Nessun gruppo</span>'}</div><button class="x fx" onclick="delLog('${l.id}')">🗑</button></div>
${l.exercises.map(e=>`<div style="margin-top:8px"><b>${esc(e.name)}</b> <span class="mu">${e.type==='cardio'?'Cardio':'Forza'}</span><br>${e.sets.map((s,j)=>`<span class="set">S${j+1} ${fmt(e.type,s)}</span>`).join('')}</div>`).join('')}</div>`).join(''):'<span class="mu">Nessun allenamento in questa data.</span>'}
function delLog(id){if(confirm('Eliminare questo allenamento?')){S.logs=S.logs.filter(l=>l.id!==id);save();rCal()}}

/* Export / Import */
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='gym-tracker-'+dk(new Date())+'.json';document.body.appendChild(a);a.click();a.remove()}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
if(!d||!Array.isArray(d.logs)||!Array.isArray(d.templates))throw 0;
if(!confirm('Sostituire i dati attuali con il backup?'))return;
S={groups:d.groups||[...DG],templates:d.templates,logs:d.logs,session:d.session||{groups:[],exercises:[]}};save();rSess();rTpls();rCal();alert('Importazione completata ✓')}catch(x){alert('File JSON non valido.')}};
r.readAsText(f);e.target.value=''};

/* Init */
$('#wDate').value=dk(new Date());C.sel=dk(new Date());rRows();rSess();
</script>
</body>
</html>
